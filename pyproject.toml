[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bonesaw"
version = "0.1.0"
description = "Python experiment shell for the Bonesaw Rust motion-rig core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.maturin]
manifest-path = "crates/bonesaw-py/Cargo.toml"
python-source = "python"
module-name = "bonesaw._bonesaw"
